name: Publish to npm

# Publishes nanoparse-mcp via npm TRUSTED PUBLISHING (OIDC).
#
# WHY THIS WAY: publishing with a classic credential needs a 2FA assertion or a
# bypass-2FA token — a long-lived secret that has to be created, delivered,
# stored and rotated. Trusted publishing replaces all of that with a short-lived
# OIDC token that GitHub mints at run time: no NPM_TOKEN, no secret in the repo
# or in CI, and no 2FA prompt.
#
# ONE-TIME SETUP (already done): on the package's npm settings page —
#   Trusted Publisher → GitHub Actions
#     Organization or user: nanoparse-dev
#     Repository:            nanoparse-mcp
#     Workflow filename:     publish.yml
#     Allowed actions:       ✓ Allow npm publish
#
# HOW TO RELEASE FROM NOW ON:
#   1. bump "version" in package.json
#   2. git commit && git push
#   3. git tag vX.Y.Z && git push origin vX.Y.Z      ← this triggers the publish
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # required: lets npm verify where this run came from

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm CLI >= 11.5.1; the runner image can lag.
      - name: Ensure a recent npm
        run: npm install -g npm@latest && npm --version

      # No NODE_AUTH_TOKEN anywhere: npm exchanges the OIDC token itself.
      # --provenance attaches a signed build attestation, which trusted
      # publishing supports natively.
      - name: Publish
        run: npm publish --access public --provenance
